services:
  panel:
    build: .
    container_name: dsdst-panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database — persisted via the volume below
      DB_PATH: /data/dsdst_panel.db
      # Automatic backups — persisted via the volume below
      BACKUP_DIR: /backups
      # Optional cloud backup upload via rclone / Cloudflare R2
      CLOUD_BACKUP_ENABLED: ${CLOUD_BACKUP_ENABLED:-false}
      CLOUD_BACKUP_PROVIDER: ${CLOUD_BACKUP_PROVIDER:-cloudflare-r2}
      CLOUD_BACKUP_RCLONE_REMOTE: ${CLOUD_BACKUP_RCLONE_REMOTE:-}
      CLOUD_BACKUP_PREFIX: ${CLOUD_BACKUP_PREFIX:-production}
      CLOUD_BACKUP_RETENTION_DAYS: ${CLOUD_BACKUP_RETENTION_DAYS:-30}
      CLOUD_BACKUP_TIMEOUT_SECONDS: ${CLOUD_BACKUP_TIMEOUT_SECONDS:-900}
      RCLONE_CONFIG_DSDSTR2_TYPE: ${RCLONE_CONFIG_DSDSTR2_TYPE:-}
      RCLONE_CONFIG_DSDSTR2_PROVIDER: ${RCLONE_CONFIG_DSDSTR2_PROVIDER:-}
      RCLONE_CONFIG_DSDSTR2_ACCESS_KEY_ID: ${RCLONE_CONFIG_DSDSTR2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_DSDSTR2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_DSDSTR2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_DSDSTR2_ENDPOINT: ${RCLONE_CONFIG_DSDSTR2_ENDPOINT:-}
      # Required secrets — fill these in before running (or use a .env file)
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      PANEL_API_HASH_SECRET: ${PANEL_API_HASH_SECRET}
      # Optional
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Comma-separated allowed origins. Leave empty to allow all (tunnel / dev).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      # SQLite database — use PANEL_DATA_DIR=/opt/dsdst-panel/data for visible host storage.
      - ${PANEL_DATA_DIR:-panel_data}:/data
      # Uploaded product images and expense attachments.
      - ${PANEL_UPLOADS_DIR:-panel_uploads}:/app/uploads
      # Automatic backup archives. Defaults to a visible ./backups folder.
      - ${PANEL_BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  panel_data:
  panel_uploads:
